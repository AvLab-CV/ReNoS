# configs/config.yaml
defaults:
  - _self_
  - app: train_dinov3 # merge/extend on top of app: default

diy_name: "_pretrained"

# train / AD
mode: train

data:
  batch_size: 8
  num_workers: 2
  pin_mem: true
  dataset: dataset-name
  data_name: fewshot-folder-name
  data_path: /path/to/fewshot-folder
  train_root: ${data.data_path}/${data.data_name}
  test_root: /path/to/dataset
  mvtec_classnames:                            
    - bottle
    - cable
    - capsule
    - carpet
    - grid
    - hazelnut
    - leather
    - metal_nut
    - pill
    - screw
    - tile
    - toothbrush
    - transistor
    - wood
    - zipper

  visa_classnames:                            
    - candle
    - capsules
    - cashew
    - chewinggum
    - fryum
    - macaroni1
    - macaroni2
    - pcb1
    - pcb2
    - pcb3
    - pcb4
    - pipe_fryum

  btad_classnames:
    - "01"
    - "02"
    - "03"

  realiad_classnames:
    - audiojack
    - bottle_cap
    - button_battery
    - end_cap
    - eraser
    - fire_hood
    - mint
    - mounts
    - pcb
    - phone_battery
    - plastic_nut
    - plastic_plug
    - porcelain_doll
    - regulator
    - rolled_strip_base
    - sim_card_set
    - switch
    - tape
    - terminalblock
    - toothbrush
    - toy
    - toy_brick
    - transistor1
    - u_block
    - usb
    - usb_adaptor
    - vcpill
    - wooden_beads
    - woodstick
    - zipper

  use_hflip: True
  use_vflip: True
  use_rotate90: True
  use_color_jitter: True
  use_gray: True
  use_blur: True

# The manuscript's Real-IAD schedule is 8000 epochs. Override for MVTec/VisA
# using the dataset/shot schedule documented in the repository README.

optimization:
  weight_decay: 1e-4
  epochs: 8000
  lr: 0.001
  lr_config: const # const, cosine, step, cosine_warmup
  min_lr: 1e-4 # for lr_config=cosine and cosine_warmup
  warmup_epoch: 100 # for lr_config=cosine_warmup
  step_size: 300 # for lr_config=step
  gamma: 0.1 # for lr_config=step

# optimization:
#   weight_decay: 1e-4
#   epochs: 4000
#   lr: 0.001
#   lr_config: const # const, cosine, step, cosine_warmup
#   min_lr: 1e-4 # for lr_config=cosine and cosine_warmup
#   warmup_epoch: 100 # for lr_config=cosine_warmup
#   step_size: 300 # for lr_config=step
#   gamma: 0.1 # for lr_config=step
  
  

testing:
  # K_a varies by dataset and shot in the paper. These are paper defaults for
  # MVTec 1-shot, VisA 1-shot, and all Real-IAD shots, respectively.
  K_top_mvtec: 10
  K_top_visa: 5
  K_top_btad: 1
  K_top_realiad: 5
  expect_fpr: 0.3     
  max_steps: 200      
  pixel_metric_size: 0
  segmentation_vis: True
  # segmentation_vis_fraction = 1 / stride, 25 張圖存 1 張 = 1 / 25 = 0.04
  segmentation_vis_fraction: 0.02
  segmentation_vis_chunk_size: 16

  #for soft mask
  use_fgs: True
  save_fg_mask: false

  fg_border_ratio: 0.05
  fg_min_area: 0.10
  fg_max_area: 0.95
  fg_morph_close_kernel: 70
  fg_morph_open_kernel: 1
  fg_mask_expand_kernel: 15
  fg_blur_sigma: 1.0
  fg_min_component_area_ratio: 0.00001
  fg_lab_l_weight: 0.05
  fg_lab_ab_weight: 1.0
  fg_min_weight: 0.3

  fg_fill_holes: True
  fg_max_hole_area_ratio: 0.12
  fg_max_hole_total_ratio: 0.25
  fgs_rescue_mode: score
  fg_rescue_score_thresh: 0.6
  fg_rescue_weight: 1.0
  fg_rescue_dilate_patches: 1
  fg_rescue_near_fg_only: false
  max_dist_patches: 3

devices: [cuda:0]

dist:
  master_addr: localhost
  master_port: 40112
  backend: nccl

hydra:
  run:
    dir: .
  output_subdir: null
  job:
    chdir: false
